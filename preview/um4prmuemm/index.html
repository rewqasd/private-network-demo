<script>
(async () => {
  const msg = document.getElementById("msg");
  const fail = text => { msg.innerHTML = "<strong>打不开这个预览</strong>" + text; };
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const k = new URLSearchParams(location.hash.slice(1)).get("k");
  if (!k) { fail("请使用完整的预览链接：链接里 # 后面那一段不能少。"); return; }
  try {
    const raw = k.replace(/-/g, "+").replace(/_/g, "/");
    const key = await crypto.subtle.importKey("raw", bytes(raw + "=".repeat((4 - raw.length % 4) % 4)), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(SEALED));
    const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    fail("链接不完整，或者已经换了新链接，请向发链接的人要最新的。");
  }
})();
</script>
